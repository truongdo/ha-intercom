host = "127.0.0.1"
port = 8000
static_dir = "/opt/live-com-ha/frontend-dist"

[audio]
device_match = "Jabra"
echo_cancel = "off"   # "speex" needs the optional speexdsp package
jitter_ms = 60

[auth]
users_file = "/var/lib/live-intercom/users.toml"
secret_file = "/var/lib/live-intercom/secret.key"
session_hours = 12
secure_cookie = false  # default false so plain-http SSH-forward testing works; true adds the Secure flag (safer, HTTPS only)

[session]
idle_timeout_s = 10
